name: Package Zone Hunter addon
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build install-ready ZIP
        run: python3 scripts/package.py
      - name: Upload install-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Zone-Hunter-install-ready
          path: dist/*.zip
          if-no-files-found: error
      - name: Publish GitHub release for tagged versions
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
