name: Package Zone Hunter addon
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach ZIP and changelog (e.g. 5.4); leave blank to package main only'
        required: false
        type: string
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: Build install-ready ZIP
        run: python3 scripts/package.py
      - name: Prepare release changelog
        if: github.event_name == 'release' || inputs.release_tag != ''
        run: python3 scripts/release_notes.py
      - name: Upload install-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zone-Hunter-install-ready
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach ZIP and changelog to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          files: dist/*.zip
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
